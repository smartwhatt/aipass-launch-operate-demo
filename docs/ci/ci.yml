# GitHub Actions CI template.
#
# The implementation token does not have the `workflow` scope, so GitHub rejects
# a push that creates `.github/workflows/ci.yml`. To activate this workflow:
#
#   mkdir -p .github/workflows
#   cp docs/ci/ci.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "Add CI" && git push
#
# It needs an account or token with the `workflow` scope. The verify job runs
# type checks, unit and integration tests, the fixture evaluation, the workbook
# check, the build, and the release gate. The live job is manual and reports a
# blocked gate when GEMINI_API_KEY is absent.
name: CI

on:
  push:
    branches: [main, demo-update]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: local
  DATA_NAMESPACE: aipass-ci
  SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
  AI_MODE: fixture
  DEMO_CONTROLS_ENABLED: "true"
  APP_VERSION: "1.0.0"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aipass_local
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aipass_test

jobs:
  verify:
    name: Type check, tests, fixture evaluation, workbook, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipass_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d aipass_local \
            -c 'create database aipass_test'
        env:
          PGPASSWORD: postgres

      - name: Integration tests
        run: npm run test:integration

      - name: Migrate and seed the demo database
        run: |
          npm run db:migrate
          npm run setup
          npm run demo:seed
          npm run demo:reset -- --scenario ep3-fixed-preview

      - name: Fixture evaluation (must pass the gate)
        run: npm run eval -- --mode fixture --suite current

      - name: Python for the workbook check
        run: |
          python3 -m venv .tools/venv
          .tools/venv/bin/pip install --quiet formulas openpyxl

      - name: Workbook formulas and cached values
        run: npm run calculator:check

      - name: Production build
        run: npm run build

      - name: Release gate
        run: npm run release:check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            artifacts/
          if-no-files-found: ignore

  live-evaluation:
    name: Live Gemini evaluation (manual, needs a key)
    # This job is manual on purpose. A missing key skips it with this name; it
    # never reports a pass. Do not move live calls into the verify job.
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipass_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: "Blocked: the live gate needs GEMINI_API_KEY"
        if: env.HAS_GEMINI_KEY != 'true'
        run: |
          echo "::error title=Live evaluation blocked::GEMINI_API_KEY is not set. This is not a pass."
          exit 1

      - name: Install dependencies
        if: env.HAS_GEMINI_KEY == 'true'
        run: npm ci

      - name: Prepare the database
        if: env.HAS_GEMINI_KEY == 'true'
        run: |
          npm run db:migrate
          npm run setup
          npm run demo:seed
          npm run demo:reset -- --scenario ep3-fixed-preview

      - name: Live evaluation
        if: env.HAS_GEMINI_KEY == 'true'
        env:
          AI_MODE: live
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          LIVE_PRICING_CONFIRMED: ${{ vars.LIVE_PRICING_CONFIRMED || 'false' }}
        run: npm run eval -- --mode live --suite current

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: artifacts/
          if-no-files-found: ignore
